upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # 처방전·복용 인증 사진 업로드 허용 크기 (backend MAX_UPLOAD_MB 와 맞춥니다)
    client_max_body_size 10m;

    # ── 백엔드 프록시 공통 설정 (아래 proxy_pass location 들이 물려받습니다) ──
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s; # AI 분석이 수 초 걸릴 수 있어 여유를 둡니다

    location /api/ {
        proxy_pass http://backend;
    }

    location = /docs {
        proxy_pass http://backend;
    }

    location = /docs/oauth2-redirect {
        proxy_pass http://backend;
    }

    location = /openapi.json {
        proxy_pass http://backend;
    }

    # ── 그 외는 정적 웹 (mobile 에서 npm run build:web 한 결과물) ──
    # SPA 라서 없는 경로(/guardian 등)는 index.html 로 넘겨 앱 라우터가 처리합니다.
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html =404;
    }
}
