# Render Blueprint — 대시보드에서 New > Blueprint 로 이 저장소를 연결하면 아래 두 서비스가 만들어집니다.
# sync: false 인 환경 변수는 값을 여기 적지 않고, 처음 적용할 때 대시보드에서 입력합니다.
services:
  # ── API (FastAPI, Docker) ──
  - type: web
    name: medi-care-api
    runtime: docker
    plan: free
    region: singapore # 만든 뒤에는 바꿀 수 없음
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL # Neon 연결 주소 (postgresql://...?sslmode=require)
        sync: false
      - key: CORS_ORIGINS # 웹 주소, 예: https://medi-care-web.onrender.com
        sync: false
      - key: TZ # Asia/Seoul
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET # dose-photos
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL # 비우면 config.py 기본값 (gemini-3.5-flash-lite)
        sync: false
      - key: MFDS_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET # 외부 크론이 X-Cron-Secret 헤더로 보내는 값
        sync: false
      - key: MISSED_AFTER_MINUTES
        value: "60"
      - key: MEDICATION_LOW_DAYS
        value: "3"
      - key: INTERNAL_TOKEN
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false

  # ── 웹 (Expo 웹 빌드, 정적 사이트) ──
  - type: web
    name: medi-care-web
    runtime: static
    # region 은 넣지 않습니다: 정적 사이트는 CDN 으로 서비스되어 Blueprint 스키마에 region 필드가 없습니다.
    rootDir: mobile
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL # API 서비스 주소, 예: https://medi-care-api.onrender.com (빌드 때 코드에 들어감)
        sync: false
    routes:
      # SPA: 없는 경로는 index.html 로 넘겨서 /guardian 같은 주소에서 새로고침해도 화면이 유지되게 합니다.
      - type: rewrite
        source: /*
        destination: /index.html
